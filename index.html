  clase:{"title":"Hacer una pregunta en clase","emoji":"✋","category":"Colegio","time":"4 min","desc":"Ensaya cómo preguntar cuando necesitas una explicación.","steps":[{"speech":"¿Habéis entendido el ejercicio?","choices":[{"text":"¿Puedes repetir el segundo paso, por favor?","ok":true,"feedback":"Has señalado exactamente qué necesitas."},{"text":"Me ayudaría ver otro ejemplo.","ok":true,"feedback":"Pedir un ejemplo es una buena estrategia."},{"text":"No digo nada aunque no lo entendí.","ok":false,"feedback":"Puedes preguntar al terminar la explicación o escribir tu duda."}]},{"speech":"¿Qué parte te gustaría que repasáramos?","choices":[{"text":"La primera, porque me he perdido.","ok":true,"feedback":"Explicarlo con tus palabras ayuda a recibir apoyo."},{"text":"¿Lo podemos hacer más despacio?","ok":true,"feedback":"Has pedido un ritmo que te viene mejor."},{"text":"No importa, ya está.","ok":true,"feedback":"Si quieres, puedes pedir ayuda en otro momento."}]}]},

// Model and WASM are downloaded only after the user chooses to turn on the camera.
let faceLandmarker=null, faceLoading=null, cameraRaf=0, cameraRun=0;
let lastFaceDisplay='', lastFaceVideoTime=-1, lastFaceFrame=0;
const MEDIAPIPE_VERSION='1.2.2';
async function getFaceLandmarker(){
  if(faceLandmarker)return faceLandmarker;
  if(faceLoading)return faceLoading;
  faceLoading=(async()=>{
    const base='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@'+MEDIAPIPE_VERSION;
    const {FilesetResolver,FaceLandmarker}=await import(base+'/vision_bundle.mjs');
    const vision=await FilesetResolver.forVisionTasks(base+'/wasm');
    const options={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true,minFaceDetectionConfidence:.5,minFacePresenceConfidence:.5,minTrackingConfidence:.5};
    try{return await FaceLandmarker.createFromOptions(vision,options)}
    catch(gpuError){options.baseOptions.delegate='CPU';return await FaceLandmarker.createFromOptions(vision,options)}
  })();
  try{faceLandmarker=await faceLoading;return faceLandmarker}
  finally{faceLoading=null}
}
function faceMessage(title,description,question=''){
 const root=document.getElementById('cameraInsights');if(!root)return;
 const key=title+'|'+description+'|'+question;if(key===lastFaceDisplay)return;
 lastFaceDisplay=key;
 root.innerHTML='<strong>'+esc(title)+'</strong><p>'+esc(description)+'</p>'+(question?'<p class="face-question">'+esc(question)+'</p>':'');
}
// Facial movement coefficients describe movements, not an emotional state or a diagnosis.
function describeFace(blendshapes){
 const scores=Object.fromEntries((blendshapes?.categories||[]).map(c=>[c.categoryName,c.score]));
 const avg=(a,b)=>((scores[a]||0)+(scores[b]||0))/2;
 const smile=avg('mouthSmileLeft','mouthSmileRight');
 const browLower=avg('browDownLeft','browDownRight');
 const browRaise=Math.max(scores.browInnerUp||0,avg('browOuterUpLeft','browOuterUpRight'));
 const wideEyes=avg('eyeWideLeft','eyeWideRight');
 const mouthOpen=scores.jawOpen||0;
 const blink=avg('eyeBlinkLeft','eyeBlinkRight');
 if(smile>.40)return ['Sonrisa visible','Se detecta movimiento de las comisuras de la boca. Una sonrisa puede tener diferentes significados.','Puedes preguntar: «¿Cómo te encuentras?»'];
 if(browLower>.46)return ['Cejas aproximadas','Se detecta un movimiento de cejas hacia el centro. Puede darse al pensar o ante una molestia.','Puedes preguntar: «¿Está todo bien?»'];
 if(browRaise>.44||wideEyes>.50)return ['Cejas u ojos más abiertos','Se aprecia una elevación de cejas o apertura de ojos. El contexto importa.','Puedes preguntar: «¿Te ha llamado la atención algo?»'];
 if(mouthOpen>.45)return ['Boca abierta','Se detecta apertura de la boca. Puede deberse a que la persona habla, bosteza u otras razones.','Si tienes dudas, pregunta en lugar de suponer.'];
 if(blink>.75)return ['Parpadeo detectado','Se ha detectado un movimiento de los párpados. No indica un sentimiento concreto.','Observa el contexto y pregunta si lo necesitas.'];
 return ['Rostro detectado','Se reconocen puntos de la cara, sin un gesto destacado en este momento.','Una expresión facial no revela por sí sola lo que siente alguien.'];
}
function drawFaceMesh(canvas,points){
 const ctx=canvas.getContext('2d');if(!ctx)return;
 const width=canvas.width,height=canvas.height;ctx.clearRect(0,0,width,height);
 if(!points?.length)return;
 ctx.fillStyle='rgba(151,239,231,.84)';
 for(let i=0;i<points.length;i+=5){const p=points[i];ctx.beginPath();ctx.arc(p.x*width,p.y*height,1.4,0,Math.PI*2);ctx.fill()}
 const oval=faceLandmarker?.constructor?.FACE_LANDMARKS_FACE_OVAL||null;
 if(oval?.length){ctx.strokeStyle='rgba(136,239,233,.75)';ctx.lineWidth=1.7;ctx.beginPath();for(const edge of oval){const aa=points[edge.start],bb=points[edge.end];if(!aa||!bb)continue;ctx.moveTo(aa.x*width,aa.y*height);ctx.lineTo(bb.x*width,bb.y*height)}ctx.stroke()}
}
function analyzeFrame(video,canvas,token){
 if(token!==cameraRun||!camStream||!document.getElementById('cameraBox'))return;
 cameraRaf=requestAnimationFrame(()=>analyzeFrame(video,canvas,token));
 if(video.readyState<2||video.videoWidth===0||video.currentTime===lastFaceVideoTime)return;
 if(performance.now()-lastFaceFrame<140)return;
 lastFaceFrame=performance.now();lastFaceVideoTime=video.currentTime;
 try{
   const detection=faceLandmarker.detectForVideo(video,performance.now());
   const pts=detection.faceLandmarks?.[0];
   if(!pts){drawFaceMesh(canvas,null);faceMessage('Buscando un rostro…','Colócate frente a la cámara y procura que haya buena iluminación.');return}
   drawFaceMesh(canvas,pts);
   const [title,explanation,question]=describeFace(detection.faceBlendshapes?.[0]);
   faceMessage(title,explanation,question);
 }catch(err){cancelAnimationFrame(cameraRaf);cameraRaf=0;drawFaceMesh(canvas,null);faceMessage('Análisis detenido','MediaPipe ha encontrado un problema al procesar el vídeo. Detén y vuelve a encender la cámara.');}
}
async function startCam(){
 const box=document.getElementById('cameraBox');if(!box)return;
 if(!navigator.mediaDevices?.getUserMedia){showToast('La cámara necesita HTTPS o localhost y un navegador compatible.');return}
 stopCam();const token=++cameraRun;
 faceMessage('Solicitando cámara…','Autoriza el acceso en el navegador para empezar.');
 try{
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
  if(token!==cameraRun){stream.getTracks().forEach(t=>t.stop());return}
  camStream=stream;
  box.innerHTML='<div class="camera-stage"><video id="neuraliaFaceVideo" autoplay muted playsinline></video><canvas id="neuraliaFaceCanvas" width="640" height="480" aria-hidden="true"></canvas></div><div class="cam-label">MediaPipe · procesado local · sin grabación</div>';
  const video=document.getElementById('neuraliaFaceVideo');
  const canvas=document.getElementById('neuraliaFaceCanvas');
  video.srcObject=stream;
  await video.play();if(token!==cameraRun)return;
  faceMessage('Preparando MediaPipe…','Cargando el modelo de reconocimiento de gestos faciales. Solo es necesario con conexión a Internet.');
  const model=await getFaceLandmarker();if(token!==cameraRun||!model)return;
  lastFaceFrame=0;lastFaceVideoTime=-1;lastFaceDisplay='';
  faceMessage('Buscando un rostro…','Mira hacia la cámara. Los gestos se analizan en tu dispositivo.');
  analyzeFrame(video,canvas,token);
  showToast('MediaPipe activo: analizando gestos faciales sin guardar imágenes.');
 }catch(err){
   if(token!==cameraRun)return;
   if(!camStream){faceMessage('No se pudo abrir la cámara','Revisa los permisos o abre la web en HTTPS o localhost.');showToast('No se pudo abrir la cámara. Comprueba los permisos.')}
   else{faceMessage('Modelo no disponible','La cámara sigue visible, pero no hay análisis. Comprueba la conexión a Internet y vuelve a intentarlo.');showToast('No se pudo cargar MediaPipe; se mantiene la vista previa de cámara.')}
 }
}

function weeklyCounts(){const days=['L','M','X','J','V','S','D'];const vals=[2,1,3,1,2,0,1];const today=new Date();state.history.forEach(x=>{const d=new Date(x.date+'T12:00:00');const diff=Math.floor((today-d)/(24*3600000));if(diff>=0&&diff<7){const idx=(d.getDay()+6)%7;vals[idx]+=1}});return days.map((d,i)=>({d,v:vals[i]}))}

v class="grid grid-2" style="margin-top:18px"><section class="card"><div class="panel-title"><h3>Personas y actividades</h3><button class="text-btn" data-action="navigate" data-route="people">Ver todas ${ico('arrow')}</button></div>${studentInfo.map(s=>`<div class="list-activity"><div class="left"><div class="mini-avatar">${s.initials}</div><div><strong>${s.name}</strong><p>${s.group}</p></div></div><span class="tag ${s.id==='alex'?'teal':''}">${s.id==='alex'?state.history.length+' actividades':'Datos demo'}</span></div>`).join('')}</section><section class="card"><div class="panel-title"><h3>Actividad semanal del grupo</h3><span class="tag teal">Muestra</span></div>${barChart(weeklyCounts(),true)}<p class="note">Gráfico ilustrativo: incluye datos ficticios y prácticas registradas en este navegador.</p></section></div><div class="section-head"><div><h2>Últimas asignaciones</h2></div></div><div class="card">${assignmentRows(4)}</div>`}

function viewStats(){const hist=state.history;const alexTasks=hist.length;const dist=[{label:'Álex Martínez',v:alexTasks,css:'#675cdd'},{label:'Noa García',v:7,css:'#15a896'},{label:'Iris López',v:4,css:'#f4b16c'}],max=Math.max(...dist.map(x=>x.v),1);return `<div class="page-title"><div class="eyebrow"><span class="dot"></span> ESTADÍSTICAS PROFESIONALES</div><h1>Información para acompañar mejor.</h1><p>Visualiza actividades, asignaciones y tipos de entrenamiento. Los datos de Noa e Iris son ficticios; los de Álex se actualizan cuando practicas.</p></div><div class="grid grid-3"><div class="card metric-card"><div class="metric-icon">${ico('check')}</div><div><div class="metric-label">Actividades de Álex</div><div class="metric-num">${hist.length}</div></div></div><div class="card metric-card"><div class="metric-icon green">${ico('sparkles')}</div><div><div class="metric-label">Entrenamientos de Álex</div><div class="metric-num">${activityCount('training')}</div></div></div><div class="card metric-card"><div class="metric-icon orange">${ico('calendar')}</div><div><div class="metric-label">Asignaciones realizadas</div><div class="metric-num">${state.assignments.filter(a=>a.status==='completed').length}</div></div></div></div><div class="grid grid-2" style="margin-top:18px"><div class="card"><div class="panel-title"><h3>Actividades por persona</h3><span class="tag grey">Comparación ilustrativa</span></div><div style="display:grid;gap:20px;margin-top:25px">${dist.map(x=>`<div><div class="row space" style="margin-bottom:8px"><b style="font-size:12px">${x.label}</b><b style="font-size:12px">${x.v}</b></div><div class="progress-track" style="height:13px"><div style="background:${x.css};height:100%;border-radius:15px;width:${x.v/max*100}%"></div></div></div>`).join('')}</div><p class="note">Estas barras representan actividades registradas, no diagnósticos ni niveles de habilidad.</p></div><div class="card"><div class="panel-title"><h3>Actividad semanal de Álex</h3><span class="tag teal">Interactivo</span></div>${barChart(weeklyCounts(),true)}</div></div><div class="section-head"><div><h2>Últimas actividades registradas</h2></div><button class="btn secondary small" data-action="exportCsv">${ico('download')} Exportar CSV</button></div><div class="card"><div class="table-scroll"><table class="table"><thead><tr><th>Actividad</th><th>Tipo</th><th>Fecha</th><th>Minutos</th></tr></thead><tbody>${hist.slice(0,12).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.kind==='training'?'Entrenamiento':x.kind==='session'?'Sesión':'Expresiones'}</td><td>${x.date}</td><td>${x.minutes}</td></tr>`).join('')}</tbody></table></div></div><div class="info-banner" style="margin-top:18px">${ico('shield')} <span><b>Privacidad:</b> en una aplicación real, el acceso a estadísticas de cada persona requeriría autorizaciones y controles de acceso. Este panel muestra únicamente datos sintéticos.</span></div>`}

app.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const d=el.dataset;switch(d.action){case 'setRole':startRole(d.role);break;case 'switchRole':switchRole();break;case 'navigate':go(d.route);break;case 'info':showToast('NEURALIA muestra datos ficticios. La cámara puede detectar gestos faciales en tu dispositivo, pero no conoce las emociones de nadie.');break;case 'mood':state.mood=d.mood;state.moodHistory.push({value:d.mood,date:now()});save();render();showToast('Estado registrado para tu propio seguimiento.');break;case 'startScenario':startScenario(d.scenario);break;case 'choose':choose(Number(d.index));break;case 'tryChoice':chosen=null;render();break;case 'nextStep':nextStep();break;case 'closeScenario':scenario=null;render();break;case 'restartScenario':startScenario(scenario);break;case 'completeScenario':completeScenario();break;case 'face':chosenFace=d.face;expressionRevealed=false;stopCam();render();break;case 'revealExpression':expressionRevealed=true;render();break;case 'completeExpression':if(state.role==='user'){record('expression',chosenFace,'Explorar: '+faceData[chosenFace].label,3);showToast('Exploración registrada en tu progreso.')}else showToast('Vista profesional: demostración explorada sin registrar datos.');expressionRevealed=false;render();break;case 'startCamera':startCam();break;case 'stopCamera':stopCam();break;case 'session':startSession(d.session);break;case 'closeSession':clearInteractions();render();break;case 'breathStart':breathRemaining=30;runBreathing();break;case 'finishSession':finishSession();break;case 'launchAssignment':if(scenarioData[d.activity])startScenario(d.activity);else if(d.activity==='emociones')go('expressions');else startSession(d.activity);break;case 'exportCsv':exportCsv();break;default:break}});
app.addEventListener('change',e=>{if(e.target.matches('[data-agenda]')){state.agenda[e.target.dataset.agenda]=e.target.checked;save();const label=e.target.closest('.checkrow');if(label){const count=Object.values(state.agenda).filter(Boolean).length;const tag=app.querySelector('.session-content .tag');if(tag)tag.textContent=count+' de 4 completados'}}});
app.addEventListener('submit',e=>{if(e.target.id==='assignForm'){e.preventDefault();const f=new FormData(e.target);const student=f.get('student'),activity=f.get('activity');if(!studentInfo.some(s=>s.id===student)||!catalog.some(c=>c.id===activity)){showToast('Selecciona una persona y una actividad válidas.');return}state.assignments.push({id:'a'+Date.now(),student,activity,date:now(),status:'pending'});save();render();showToast('Actividad asignada. Entra como Álex para verla si la elegiste para él.')}});
render();
})();
</script>
</body>
</html>
